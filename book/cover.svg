<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <!-- ============================================================
       ebook-nginx-hardening cover
       风格沿用 ebook-ssh-hardening / ebook-procfs-hardening
       (深蓝渐变 + 橙强调色 + 中文衬线)
       ePub build 引用 cover.png，发布前需要 SVG → 1200x1600 PNG
       ============================================================ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>

  <!-- 主标题：NGINX -->
  <text x="600" y="430" text-anchor="middle"
        font-family="Noto Serif CJK SC, Source Han Serif SC, serif"
        font-weight="700" font-size="120" fill="#e67e22">NGINX</text>

  <!-- 副标题 -->
  <text x="600" y="560" text-anchor="middle"
        font-family="Noto Serif CJK SC, Source Han Serif SC, serif"
        font-weight="700" font-size="74" fill="#ffffff">纵深加固</text>

  <text x="600" y="780" text-anchor="middle"
        font-family="Noto Serif CJK SC, Source Han Serif SC, serif"
        font-weight="400" font-size="40" fill="#cccccc">从反向代理到 WAF 实战</text>

  <line x1="300" y1="930" x2="900" y2="930" stroke="#e67e22" stroke-width="2"/>

  <text x="600" y="1080" text-anchor="middle"
        font-family="Noto Serif CJK SC, Source Han Serif SC, serif"
        font-size="36" fill="#aaaaaa">LeisureLinux</text>

  <text x="600" y="1480" text-anchor="middle"
        font-family="monospace" font-size="28" fill="#666666">ebook-nginx-hardening</text>
</svg>